site_name: Workflow Monitor
site_url: https://dawndust.github.io/workflow-monitor/
repo_url: https://github.com/DawnDust/workflow-monitor
repo_name: DawnDust/workflow-monitor
copyright: Copyright &copy; 2026 DawnDust and contributors
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Getting started: 快速开始
            Using the workbench: 使用工作台
            Maintenance and research: 维护与探索
            Advanced usage: 高级使用
            Troubleshooting: 故障排查
            Contributor guide: 维护者指南
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Using the workbench: workbench.md
  - Maintenance and research: lifecycle.md
  - Advanced usage: advanced.md
  - Troubleshooting: troubleshooting.md
  - Contributor guide: contributing.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
strict: true
