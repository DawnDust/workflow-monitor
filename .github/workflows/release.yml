name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest tests.test_distribution
      - if: runner.os == 'Windows' && matrix.python == '3.12'
        run: python -m unittest tests.test_project_hooks

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(python -c 'import project_hooks; print(project_hooks.__version__)')"
          test "$VERSION" = "$(python -c 'import tomllib; print(tomllib.load(open(\"pyproject.toml\", \"rb\"))[\"project\"][\"version\"])')"
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/build_release.py --version "${GITHUB_REF_NAME#v}"
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/project-hooks-core-*.zip
            dist/release-manifest.json
          generate_release_notes: true
