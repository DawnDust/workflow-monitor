name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Full test, build and frozen smoke
        run: python scripts/run_tests.py release
      - name: Apply optional Authenticode signature
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: ./scripts/sign_windows_exe.ps1 -Executable dist/workflow-monitor.exe -Output dist/authenticode.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/workflow-monitor.exe
          format: spdx-json
          output-file: dist/workflow-monitor.spdx.json
          upload-artifact: false
      - name: Finalize release manifest
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          python scripts/build_release.py --version $version --sbom dist/workflow-monitor.spdx.json --authenticode-json dist/authenticode.json
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/workflow-monitor.exe
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/workflow-monitor.exe
          sbom-path: dist/workflow-monitor.spdx.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/workflow-monitor.exe
            dist/release-manifest.json
            dist/workflow-monitor.spdx.json
          generate_release_notes: true
