name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest tests.test_distribution tests.test_project_hooks
      - name: Build executable
        run: |
          python -m pip install pyinstaller==6.21.0
          python scripts/build_windows_exe.py
      - name: Build release manifest
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          python scripts/build_release.py --version $version
      - name: Smoke test executable
        shell: powershell
        run: |
          $output = & .\dist\project-hooks.exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output | Select-String 'application_version'
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/project-hooks.exe
            dist/release-manifest.json
          generate_release_notes: true
