name: Bug 报告
description: 报告 project-hooks 的错误、冲突或异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先检查诊断 ZIP，再将其拖入下方附件区域；程序不会自动上传任何数据。
  - type: input
    id: version
    attributes:
      label: project-hooks 版本
      placeholder: 例如 1.3.0
    validations:
      required: true
  - type: input
    id: incident
    attributes:
      label: 事件编号
      description: 可从错误提示或诊断包 report.md 获取。
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: 请按顺序说明执行了什么。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: 诊断包
      description: 请检查内容后，把 project-hooks-diagnostics-*.zip 拖到这里。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已检查附件，并确认其中没有不希望公开的信息。
          required: true
